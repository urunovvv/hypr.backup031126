# ==========================================
# HYPRLOCK CONFIGURATION
# ==========================================

# 1. Задний фон (Background)
background {
    monitor =
    path = /home/firuz/Custom/lock.jpg
    color = rgba(25, 20, 20, 1.0) # Цвет по умолчанию, если изображение не загрузилось

    # Эффекты размытия для аккуратного внешнего вида
    blur_passes = 2 # Количество проходов размытия (0 - отключено)
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 2. Аватар / Изображение профиля (Image)
image {
    monitor =
    path = # /home/firuz/Custom/avtr.jpeg
    size = 180 # Размер картинки в пикселях
    rounding = -1 # -1 для создания идеального круга

    border_size = 4
    border_color = rgba(255, 255, 255, 0.8)

    position = 0, 100
    halign = center
    valign = center
}

# 3. Часы (Label)
label {
    monitor =
    text = $TIME # Автоматическая переменная системного времени
    color = rgba(242, 243, 244, 0.95)
    font_size = 64
    font_family = JetBrainsMono Nerd Font

    position = 0, 230
    halign = center
    valign = center
}

# 4. Приветствие / Имя пользователя (Label)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 25
    font_family = JetBrainsMono Nerd Font

    position = 0, 145
    halign = center
    valign = center
}

# 5. Поле ввода пароля (Input Field)
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26 # Размер точек при вводе пароля
    dots_spacing = 0.15 # Расстояние между точками
    dots_center = true
    dots_rounding = -1 # Круглые точки ввода
    
    outer_color = rgba(100, 114, 125, 0.5)
    inner_color = rgba(20, 20, 20, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i> # Текст подсказки
    hide_input = false
    
    # Цветовая индикация состояний
    check_color = rgba(204, 136, 34, 0.8) # Цвет при проверке
    fail_color = rgba(255, 255, 255, 1)   # Цвет при ошибке
    fail_text = ХАХАХАХАХА! ЛОООООХ! # Текст при ошибке ввода

    rounding = -1 # Скругление углов поля ввода

    position = 0, -80
    halign = center
    valign = center
}
